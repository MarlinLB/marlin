# marlind's file-managed equivalent of gue_wsl.sh's seed() verb, for driving the
# GUE rig's SCTP path from a real marlind instance rather than bpftool and
# marlin_seed. The object path is relative, so marlind must be started from the
# repository root. Do not also run gue_wsl.sh seed: while marlind runs with
# --config it is the only writer of these maps (deploy/marlin.conf.example),
# and seed's direct bpftool/marlin_seed writes bypass that.
#
#   data-plane/scripts/gue_wsl.sh up
#   sudo data-plane/build/marlind/marlind \
#       --config data-plane/scripts/marlin-sctp-wsl.conf --attach --xdp-mode=generic
#   sudo data-plane/scripts/gue_wsl.sh test_sctp_ping
#
# --xdp-mode=generic is required here, not optional: on a kernel whose veth
# native XDP_TX silently drops a frame grown by bpf_xdp_adjust_head() (this
# repo's own WSL2 dev rigs -- see docs/design/02-architecture.md), the native
# default fails the same way gue_wsl.sh's own header describes.
#
# Validate first with --check, which needs no privilege. marlind refuses a
# group- or world-writable file: if a umask of 002 left this at 0664, chmod it
# to 0644.
#
# The SCTP VIP's port (38412, the NGAP port also used by
# deploy/marlin.conf.example) must equal gue_wsl.sh's SCTP_PORT
# (MARLIN_SCTP_PORT), since test_sctp_ping's server binds to it directly
# rather than reading this file.

[instance]
interface  = "mgulan0"
object     = "data-plane/build/bpf/marlin.bpf.o"
pin_dir    = "/sys/fs/bpf/mgue"
tunnel_src = "198.19.5.10"
max_frame  = 1614

[[backend]]
name        = "gue-be"
id          = 1
addr        = "198.19.6.22"
mode        = "gue"
state       = "up"
encap_dport = 6080

# The root namespace has no route to 198.19.6.0/24, so a FIB lookup would drop
# every packet; the nexthop has to be the MAC swap back at the router.
fib         = false

# Kept alongside the SCTP VIP below so test_http_get and verify (gue_wsl.sh)
# still work against this same instance -- no restart needed to switch which
# protocol is under test.
[[vip]]
addr       = "198.18.3.1"
port       = 80
proto      = "tcp"

# marlin_seed's own SEED_HASH_KEY (tools/marlin_seed.c:35), so the datapath sees
# identical state whether marlind or seed() wrote it last.
hash_key   = "6d61726c696e2d736565640000000000"

# Arbitrary: one member means fwd_gen_block()'s i == 0 branch (fwd_gen.c:66)
# names backend 1 on every row for any seed, matching marlin_seed's constant fill.
table_seed = "a1b2c3d4e5f60718293a4b5c6d7e8f90"

members = [{ backend = "gue-be", weight = 100 }]

# test_sctp_ping's client (gue_wsl.sh) uses a fixed source port, not an
# ephemeral one -- sctp_test requires -P on the client side, and the port it
# gets is the rig's own SCTP_CLI_PORT, chosen once and reused every run. With
# a fixed source port, hash_ports would collapse every run onto the same row
# for a reason that has nothing to do with the flag: it hashes the source and
# destination port pair for exactly the failover case where the *address*
# changes and the port does not (docs/design/32-sctp.md, "VIP_HASH_PORTS";
# DEPLOYMENT.md §1.7.4). A single fixed-port peer gains nothing from it here,
# so this VIP stays on the default address hash.
[[vip]]
addr       = "198.18.3.1"
port       = 38412
proto      = "sctp"
hash_key   = "223344556677889900aabbccddeeff11"
table_seed = "6510c81c3650ff010f98c66f96e46dcf"

members = [{ backend = "gue-be", weight = 100 }]
